name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check syntax
        run: python -m py_compile warm_model_manager.py test_warm_model_manager.py
      - name: Run offline tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Check CLI help and version
        run: |
          python warm_model_manager.py --version
          python warm_model_manager.py --help
